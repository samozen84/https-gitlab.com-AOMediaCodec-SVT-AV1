name: Build SVT-AV1 Mobile Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Recursively
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake gcc g++ nasm python3

      - name: Search and Force Build Source
        run: |
          # Locate CMakeLists.txt anywhere in workspace
          TARGET_DIR=$(find . -name "CMakeLists.txt" -not -path "*/build*" | head -n 1 | xargs dirname)
          
          if [ -z "$TARGET_DIR" ]; then
            echo "ERROR: CMakeLists.txt was not found anywhere in this repository."
            echo "Current Workspace Tree Layout:"
            ls -R
            exit 1
          fi
          
          echo "Target Source Directory Identified: $TARGET_DIR"
          mkdir -p build_linux
          cd build_linux
          cmake "../$TARGET_DIR" -DMOBILE_BUILD=ON -DRTC_BUILD=OFF -DMINIMAL_BUILD=ON -DBUILD_TESTING=OFF
          make -j$(nproc)

      - name: Upload Linux Binaries
        uses: actions/upload-artifact@v4
        with:
          name: svt-av1-linux-mobile
          path: |
            **/Bin/
            **/Source/API/

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository Recursively
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Set up MSYS2 Environment
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-nasm
            mingw-w64-ucrt-x86_64-python

      - name: Configure and Compile SVT-AV1 (Windows MSYS2)
        shell: msys2 {0}
        run: |
          TARGET_DIR=$(find . -name "CMakeLists.txt" -not -path "*/build*" | head -n 1 | xargs dirname)
          
          if [ -z "$TARGET_DIR" ]; then
            echo "ERROR: CMakeLists.txt was not found on Windows check paths."
            ls -R
            exit 1
          fi
          
          mkdir -p build_windows
          cd build_windows
          cmake -G "Ninja" "../$TARGET_DIR" -DCMAKE_BUILD_TYPE=Release -DMOBILE_BUILD=ON -DRTC_BUILD=OFF -DMINIMAL_BUILD=ON -DBUILD_TESTING=OFF -DENABLE_NASM=ON
          ninja

      - name: Upload Windows Binaries
        uses: actions/upload-artifact@v4
        with:
          name: svt-av1-windows-mobile
          path: |
            **/Bin/
            **/Source/API/
