name: Build SVT-AV1 Mobile Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Official SVT-AV1 Source Code
        uses: actions/checkout@v4
        with:
          repository: 'AOMediaCodec/SVT-AV1'
          ref: 'master'
          path: 'svt-source'

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake gcc g++ nasm python3

      - name: Apply Mobile Configuration Patch
        run: |
          cd svt-source
          sed -i 's/option(MOBILE_BUILD ".*" OFF)/option(MOBILE_BUILD "Mobile Build" ON)/g' CMakeLists.txt || true
          sed -i 's/option(MINIMAL_BUILD ".*" OFF)/option(MINIMAL_BUILD "Minimal Build" ON)/g' CMakeLists.txt || true

      - name: Configure and Build SVT-AV1 (Linux Static)
        run: |
          mkdir -p build_linux
          cd build_linux
          # -DBUILD_SHARED_LIBS=OFF forces a single static binary file
          cmake ../svt-source -DCMAKE_BUILD_TYPE=MinSizeRel -DBUILD_SHARED_LIBS=OFF -DMOBILE_BUILD=ON -DRTC_BUILD=OFF -DMINIMAL_BUILD=ON -DBUILD_TESTING=OFF
          make -j$(nproc)
          strip Bin/Release/* || true

      - name: Upload Linux Binaries
        uses: actions/upload-artifact@v4
        with:
          name: svt-av1-linux-mobile-standalone
          path: |
            build_linux/Bin/
          if-no-files-found: warn

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Fetch Official SVT-AV1 Source Code (Windows)
        uses: actions/checkout@v4
        with:
          repository: 'AOMediaCodec/SVT-AV1'
          ref: 'master'
          path: 'svt-source'

      - name: Set up MSYS2 Environment
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-nasm
            mingw-w64-ucrt-x86_64-python

      - name: Configure and Compile SVT-AV1 (Windows MSYS2 Static)
        shell: msys2 {0}
        run: |
          cd svt-source
          sed -i 's/option(MOBILE_BUILD ".*" OFF)/option(MOBILE_BUILD "Mobile Build" ON)/g' CMakeLists.txt || true
          sed -i 's/option(MINIMAL_BUILD ".*" OFF)/option(MINIMAL_BUILD "Minimal Build" ON)/g' CMakeLists.txt || true
          
          cd ..
          mkdir -p build_windows
          cd build_windows
          # -DBUILD_SHARED_LIBS=OFF forces the Windows compiler to build a standalone executable
          cmake -G "Ninja" ../svt-source -DCMAKE_BUILD_TYPE=MinSizeRel -DBUILD_SHARED_LIBS=OFF -DMOBILE_BUILD=ON -DRTC_BUILD=OFF -DMINIMAL_BUILD=ON -DBUILD_TESTING=OFF -DENABLE_NASM=ON
          ninja
          strip Bin/* || true

      - name: Upload Windows Standalone Binary
        uses: actions/upload-artifact@v4
        with:
          name: svt-av1-windows-mobile-standalone
          path: |
            build_windows/Bin/SvtAv1EncApp.exe
          if-no-files-found: warn
