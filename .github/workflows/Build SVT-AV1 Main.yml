name: Build SVT-AV1 Mobile Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake gcc g++ nasm

      - name: Configure CMake (Linux Mobile Minimal)
        run: |
          mkdir build
          cd build
          cmake .. -DMOBILE_BUILD=ON -DMINIMAL_BUILD=ON -DBUILD_TESTING=OFF

      - name: Compile SVT-AV1 (Linux)
        run: |
          cd build
          make -j$(nproc)

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up MinGW and NASM
        uses: egor-tisin/setup-mingw-and-nasm@v1.3
        with:
          mingw-version: 13.2.0

      - name: Configure CMake (Windows Mobile Minimal)
        shell: pwsh
        run: |
          mkdir build
          cd build
          cmake -G "MinGW Makefiles" .. -DMOBILE_BUILD=ON -DMINIMAL_BUILD=ON -DBUILD_TESTING=OFF

      - name: Compile SVT-AV1 (Windows GCC)
        shell: pwsh
        run: |
          cd build
          mingw32-make -j $env:NUMBER_OF_PROCESSORS
