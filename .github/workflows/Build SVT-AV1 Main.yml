name: Build SVT-AV1 Mobile Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # -------------------------------------------------------------
  # LINUX BUILD JOB
  # -------------------------------------------------------------
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake gcc g++ nasm

      - name: Configure CMake (Linux Mobile Minimal)
        run: |
          mkdir build
          cd build
          cmake .. \
            -DMOBILE_BUILD=ON \
            -DMINIMAL_BUILD=ON \
            -DBUILD_TESTING=ON

      - name: Compile SVT-AV1 (Linux)
        run: |
          cd build
          make -j$(nproc)

  # -------------------------------------------------------------
  # WINDOWS BUILD JOB
  # -------------------------------------------------------------
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up MSVC & Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install NASM (Windows)
        run: |
          choco install nasm
          echo "C:\Program Files\NASM" >> $GITHUB_PATH

      - name: Configure CMake (Windows Mobile Minimal)
        shell: cmd
        run: |
          mkdir build
          cd build
          cmake -G "Visual Studio 17 2022" -A x64 .. ^
            -DMOBILE_BUILD=ON ^
            -DMINIMAL_BUILD=ON ^
            -DBUILD_TESTING=ON

      - name: Compile SVT-AV1 (Windows MSVC)
        shell: cmd
        run: |
          cd build
          cmake --build . --config Release -j %NUMBER_OF_PROCESSORS%
