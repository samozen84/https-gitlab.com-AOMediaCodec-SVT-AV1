name: Build SVT-AV1 Mobile Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake gcc g++ nasm

      - name: Configure CMake (Linux Mobile Minimal)
        run: |
          mkdir build
          cd build
          cmake .. -DMOBILE_BUILD=ON -DMINIMAL_BUILD=ON -DBUILD_TESTING=OFF

      - name: Compile SVT-AV1 (Linux)
        run: |
          cd build
          make -j$(nproc)

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up MSYS2 Environment
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-nasm

      - name: Configure and Compile SVT-AV1 (Windows MSYS2)
        shell: msys2 {0}
        run: |
          mkdir -p build
          cd build
          cmake -G "Ninja" .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DMOBILE_BUILD=ON \
            -DMINIMAL_BUILD=ON \
            -DBUILD_TESTING=OFF
          ninja
