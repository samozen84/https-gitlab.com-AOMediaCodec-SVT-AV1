name: Build SVT-AV1 Mobile Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      # Use the native checkout tool to pull the real repository, avoiding git clone errors
      - name: Fetch SVT-AV1 Source Code
        uses: actions/checkout@v4
        with:
          repository: 'AOMediaCodec/SVT-AV1'
          ref: 'aa50400b4cef330626ece7f9b4021df4051804a2'
          path: 'svt-source'

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake gcc g++ nasm python3

      - name: Configure and Build SVT-AV1 (Linux)
        run: |
          mkdir -p build_linux
          cd build_linux
          cmake ../svt-source -DMOBILE_BUILD=ON -DRTC_BUILD=OFF -DMINIMAL_BUILD=ON -DBUILD_TESTING=OFF
          make -j$(nproc)

      - name: Upload Linux Binaries
        uses: actions/upload-artifact@v4
        with:
          name: svt-av1-linux-mobile
          path: |
            build_linux/Bin/
            build_linux/Source/API/

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Fetch SVT-AV1 Source Code (Windows)
        uses: actions/checkout@v4
        with:
          repository: 'AOMediaCodec/SVT-AV1'
          ref: 'aa50400b4cef330626ece7f9b4021df4051804a2'
          path: 'svt-source'

      - name: Set up MSYS2 Environment
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-nasm
            mingw-w64-ucrt-x86_64-python

      - name: Configure and Compile SVT-AV1 (Windows MSYS2)
        shell: msys2 {0}
        run: |
          mkdir -p build_windows
          cd build_windows
          cmake -G "Ninja" ../svt-source -DCMAKE_BUILD_TYPE=Release -DMOBILE_BUILD=ON -DRTC_BUILD=OFF -DMINIMAL_BUILD=ON -DBUILD_TESTING=OFF -DENABLE_NASM=ON
          ninja

      - name: Upload Windows Binaries
        uses: actions/upload-artifact@v4
        with:
          name: svt-av1-windows-mobile
          path: |
            build_windows/Bin/
            build_windows/Source/API/
