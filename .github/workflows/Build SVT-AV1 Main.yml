name: Build SVT-AV1

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: 

jobs:
  build-linux:
    name: Build on Linux (Ubuntu)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code and Submodules
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake nasm gcc g++

      - name: Configure and Build
        run: |
          cd gitlab-src/Build
          cmake .. -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=Release
          make -j$(nproc)

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: svt-av1-linux-bin
          path: gitlab-src/Bin/Release/SvtAv1EncApp

  build-windows:
    name: Build on Windows
    runs-on: windows-latest

    steps:
      - name: Checkout Code and Submodules
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Set up MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Assembly Compiler (NASM)
        uses: ilammy/setup-nasm@v1

      - name: Configure and Build with CMake
        shell: cmd
        run: |
          cd gitlab-src
          mkdir Build
          cd Build
          cmake .. -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release
          cmake --build . --config Release -j %NUMBER_OF_PROCESSORS%

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: svt-av1-windows-bin
          path: gitlab-src/Bin/Release/SvtAv1EncApp.exe
