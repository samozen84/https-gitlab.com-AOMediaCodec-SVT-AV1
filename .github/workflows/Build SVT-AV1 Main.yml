name: Build SVT-AV1 Mobile Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake gcc g++ nasm python3

      - name: Debug - List Repository Contents
        run: |
          echo "=== ROOT DIRECTORY CONTENTS ==="
          ls -la
          echo "=== SEARCHING FOR CMAKELISTS.TXT ==="
          find . -name "CMakeLists.txt"

      - name: Configure CMake (Linux Mobile Minimal)
        run: |
          # Create build folder
          mkdir -p build_linux
          cd build_linux
          
          # Attempt to find the correct directory automatically
          if [ -f "../CMakeLists.txt" ]; then
            TARGET_SRC=".."
          elif [ -f "../SVT-AV1/CMakeLists.txt" ]; then
            TARGET_SRC="../SVT-AV1"
          else
            # Fallback search if nested elsewhere
            TARGET_SRC=$(find .. -name "CMakeLists.txt" -not -path "*/build_linux/*" | head -n 1 | xargs dirname)
          fi
          
          echo "Found CMakeLists.txt source target at: $TARGET_SRC"
          cmake "$TARGET_SRC" -DMOBILE_BUILD=ON -DRTC_BUILD=OFF -DMINIMAL_BUILD=ON -DBUILD_TESTING=OFF

      - name: Compile SVT-AV1 (Linux)
        run: |
          cd build_linux
          make -j$(nproc)

      - name: Upload Linux Binaries
        uses: actions/upload-artifact@v4
        with:
          name: svt-av1-linux-mobile
          path: |
            build_linux/Bin/
            build_linux/Source/API/

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up MSYS2 Environment
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-nasm
            mingw-w64-ucrt-x86_64-python

      - name: Configure and Compile SVT-AV1 (Windows MSYS2)
        shell: msys2 {0}
        run: |
          mkdir -p build_windows
          cd build_windows
          
          # Find source target
          if [ -f "../CMakeLists.txt" ]; then
            TARGET_SRC=".."
          elif [ -f "../SVT-AV1/CMakeLists.txt" ]; then
            TARGET_SRC="../SVT-AV1"
          else
            TARGET_SRC=$(find .. -name "CMakeLists.txt" -not -path "*/build_windows/*" | head -n 1 | xargs dirname)
          fi
          
          cmake -G "Ninja" "$TARGET_SRC" -DCMAKE_BUILD_TYPE=Release -DMOBILE_BUILD=ON -DRTC_BUILD=OFF -DMINIMAL_BUILD=ON -DBUILD_TESTING=OFF -DENABLE_NASM=ON
          ninja

      - name: Upload Windows Binaries
        uses: actions/upload-artifact@v4
        with:
          name: svt-av1-windows-mobile
          path: |
            build_windows/Bin/
            build_windows/Source/API/
