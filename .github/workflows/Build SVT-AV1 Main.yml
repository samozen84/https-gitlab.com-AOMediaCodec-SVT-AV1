name: Build SVT-AV1

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: 

jobs:
  build-linux:
    name: Build on Linux (Ubuntu)
    runs-on: ubuntu-latest

    steps:
      - name: Fetch Codebase via Web API
        run: |
          curl -L "https://gitlab.com" | tar -xz
          mv SVT-AV1-master* svt-av1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake nasm gcc g++

      - name: Configure and Build
        run: |
          cd svt-av1
          cmake -S . -B Build -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=Release
          cmake --build Build -j $(nproc)

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: svt-av1-linux-bin
          path: svt-av1/Bin/Release/SvtAv1EncApp

  build-windows:
    name: Build on Windows
    runs-on: windows-latest

    steps:
      - name: Fetch and Extract Codebase
        shell: cmd
        run: |
          :: Download the Linux compressed tarball which extracts reliably via Windows tar
          curl.exe -L "https://gitlab.com" -o svt-av1.tar.gz
          
          :: Native Windows tar handles cross-platform folder generation perfectly
          tar.exe -xzf svt-av1.tar.gz
          
          :: Rename using standard command line tools
          ren SVT-AV1-master svt-av1

      - name: Set up MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Assembly Compiler (NASM)
        uses: ilammy/setup-nasm@v1

      - name: Configure and Build with CMake
        shell: cmd
        run: |
          cd svt-av1
          cmake -S . -B Build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release
          cmake --build Build --config Release -j %NUMBER_OF_PROCESSORS%

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: svt-av1-windows-bin
          path: svt-av1/Bin/Release/SvtAv1EncApp.exe
